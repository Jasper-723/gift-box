<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点一下，打开礼物</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#fff;color:#4a3f36;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;min-height:100%;padding:20px 14px;
    -webkit-tap-highlight-color:transparent;
  }
  .stage-wrap{width:min(628px,90vw);line-height:0;position:relative}
  svg#stage{width:100%;height:auto;display:block;overflow:visible;touch-action:manipulation}

  /* ---- lid: pivot at (240,348) is the group's local origin ---- */
  .lid-g{
    transform:translate(0,0) rotate(0deg);
    transition:transform .95s cubic-bezier(.19,.9,.24,1.03);
    will-change:transform;
  }
  .open .lid-g{transform:translate(-98px,-78px) rotate(7.5deg)}
  .lid-shadow{opacity:0;transition:opacity .55s ease}
  .open .lid-shadow{opacity:.55;transition:opacity .75s ease .08s}

  /* ---- light ---- */
  .glow-breathe{animation:breathe 3.6s ease-in-out infinite;transform-origin:0 0}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .halo{opacity:0;transition:opacity .8s ease}
  .open .halo{opacity:.9;transition:opacity 1s ease .1s}
  .beam{opacity:0;transition:opacity .55s ease}
  .open .beam{opacity:1;transition:opacity .8s ease .06s}

  /* ---- photo that pops out ---- */
  .card-g{
    opacity:0;
    transform:translate(0px,26px) scale(.22);
    transition:opacity .28s ease,transform .42s cubic-bezier(.4,.1,.7,.5);
    filter:drop-shadow(0 7px 9px rgba(70,45,20,.30));
  }
  .open .card-g{
    opacity:1;
    transform:translate(0px,0px) scale(1);
    transition:opacity .45s ease .24s,transform .95s cubic-bezier(.16,1.26,.3,1) .18s;
  }
  .card-bob{animation:bob2 3.8s ease-in-out infinite}
  @keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}

  /* ---- sparkles ---- */
  .spark{opacity:0;transform:translate(0,7px) scale(.25);transition:opacity .28s ease,transform .35s ease}
  .open .spark{
    opacity:1;transform:translate(0,-9px) scale(1);
    transition:opacity .5s ease var(--d),transform .8s cubic-bezier(.2,1.3,.35,1) var(--d);
  }
  .twinkle{animation:twinkle 2.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

  .hit{fill:#fff;fill-opacity:0;cursor:pointer;pointer-events:all;outline:none}
  .ring{opacity:0;transition:opacity .18s ease;pointer-events:none}
  .ring.on{opacity:.85}

  .hint{
    display:flex;align-items:center;gap:.55em;
    font-size:13px;letter-spacing:.16em;color:#ad9d8c;user-select:none;
    transition:opacity .7s ease,transform .7s ease;
  }
  .hint.gone{opacity:0;transform:translateY(5px)}
  .hint i{width:6px;height:6px;border-radius:50%;background:#e8bd92;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(232,189,146,.45)}
    70%{box-shadow:0 0 0 9px rgba(232,189,146,0)}
    100%{box-shadow:0 0 0 0 rgba(232,189,146,0)}
  }
  @media (prefers-reduced-motion:reduce){
    .lid-g,.lid-shadow,.halo,.beam,.card-g,.spark,.hint{transition-duration:.12s!important}
    .glow-breathe,.card-bob,.twinkle,.hint i{animation:none!important}
  }
</style>
</head>
<body>

<div class="stage-wrap">
<svg id="stage" viewBox="0 0 628 628" role="group" aria-label="一只抱礼盒的小猫">
  <defs>
    <radialGradient id="gWarm">
      <stop offset="0"    stop-color="#fff0cd" stop-opacity=".92"/>
      <stop offset=".38"  stop-color="#ffd49a" stop-opacity=".62"/>
      <stop offset=".72"  stop-color="#ffb375" stop-opacity=".22"/>
      <stop offset="1"    stop-color="#ffa15e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gHalo">
      <stop offset="0"   stop-color="#ffe3b6" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#ffcf96" stop-opacity=".10"/>
      <stop offset="1"   stop-color="#ffbc82" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipOpening">
      <polygon points="148,330 240,304 336,322 282,350"/>
    </clipPath>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffd2a4"/>
      <stop offset=".42" stop-color="#ff9d80"/>
      <stop offset="1"   stop-color="#ef6472"/>
    </linearGradient>
    <filter id="blurL" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blurS" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <g id="star" fill="#fff7e2">

    </g>

    </g>

<script>
(function(){
  var stage=document.getElementById('stage'),
      hit=document.getElementById('hit'),
      ring=document.getElementById('ring'),
      hint=document.getElementById('hint'),
      open=false;

  function setOpen(v){
    open=v;
    stage.classList.toggle('open',open);
    hit.setAttribute('aria-pressed',open?'true':'false');
    if(open) hint.classList.add('gone');
  }
  function toggle(){ setOpen(!open); }

  hit.addEventListener('click',toggle);
  hit.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();toggle();}
  });
  hit.addEventListener('focus',function(){ring.classList.add('on')});
  hit.addEventListener('blur',function(){ring.classList.remove('on')});

  // Deep-link for previews: index.html?open=1 opens the box on load.
  try{
    if(new URLSearchParams(location.search).has('open')){
      hint.classList.add('gone');
      setTimeout(function(){setOpen(true)},80);
    }
  }catch(e){}
})();
</script>
